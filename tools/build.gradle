plugins {
    id 'application'
}

application {
    mainClass = 'com.gamexy.tools.GenerateAssetsMain'
}

tasks.register('generateAssets', JavaExec) {
    group = 'assets'
    description = 'Generates standalone .glb 3D model files into assets/models/'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gamexy.tools.GenerateAssetsMain'
    args = [rootProject.file('assets/models').absolutePath]
}
